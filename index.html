<!DOCTYPE html>
<html lang="de">
<head>

<style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: #f5f7f5;
      color: #26352d;
    }
 header {
   position: relative;
    background-image: url("Titelbild.png");
    background-size: 100% auto;
    background-position: center top;
    background-repeat: no-repeat;
    background-color: #ffffff;

    width: 100%;
    aspect-ratio: 3 / 1;
    height: auto;
    min-height: 0;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
}
}
header h1,
header p {
    display: none;
    color: white;
    text-align: center;
}
    main { max-width: 1100px; margin: auto; padding: 25px; }
    .filter { margin: 20px 0; }
    select, input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 5px;
    }
    .hunde {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 320px));
      gap: 20px;
    }
    .hund {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px #0002;
    }
    .hund img {
      width: 100%;
      height: 350px;
      object-fit: contain;
    }
    .inhalt { padding: 20px; }
    .status { color: #28734c; font-weight: bold; }
    .button {
      display: inline-block;
      padding: 12px 18px;
      background: #285b45;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
}
  </style>
</head>
<body>
  <button onclick="document.getElementById('mitarbeiter-login').hidden = false">🔐 Mitarbeiter-Login</button>
  <div id="mitarbeiter-login"hidden>
  <h3>🐾 Mitarbeiter-Anmeldung</h3>
  <input type="email" id="login-email" placeholder="E-Mail-Adresse">
  <input type="password" id="login-passwort" placeholder="Passwort">
  <button id="login-button">Anmelden</button>
  <p id="login-meldung"></p>
</div>
  <header>
  </header>

  <main>
    <h2>Unsere Schützlinge</h2>
    <div class="filter" id="hundefilter">
      <input id="suche" placeholder="Hund suchen..." oninput="filtern()">
      <select id="status" onchange="filtern()">
        <option value="">Alle Hunde</option>
        <option>Vermittelbar</option>
        <option>Reserviert</option>
        <option>Ausgereist</option>
      </select>
    </div>

 <div class="hunde" id="hundeliste"></div>
    <div id="hundedetails" hidden></div>
  </main>

  <script>
    function filtern() {
      const suche = document.getElementById("suche").value.toLowerCase();
      const status = document.getElementById("status").value;
      document.querySelectorAll(".hund").forEach(hund => {
        const passt = hund.dataset.name.includes(suche) &&
          (!status || hund.dataset.status === status);
        hund.style.display = passt ? "" : "none";
      });
    }

    async function ladeHunde() {
  const { data, error } = await supabaseClient
    .from("hunde")
    .select("*");

  if (error) {
    console.error("Fehler beim Laden:", error);
    return;
  }

  const liste = document.getElementById("hundeliste");
  liste.innerHTML = "";

  data.forEach(hund => {
    const karte = document.createElement("div");
    karte.className = "hund";
    karte.style.cursor = "pointer";
karte.addEventListener("click", () => zeigeHund(hund));
    karte.dataset.name = hund.name || "";
    karte.dataset.status = hund.vermittlungsstatus || "";
if (hund.fotos && hund.fotos.length > 0) {
  const bild = document.createElement("img");
  bild.src = hund.fotos[0];
  bild.alt = "Foto von " + hund.name;
  karte.append(bild);
}
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";

    const name = document.createElement("h2");
    name.textContent = hund.name || "Unbekannt";

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = hund.vermittlungsstatus || "";

    const alter = document.createElement("p");
alter.textContent = "Alter: " + (hund.alter ?? "Keine Angabe");

const geschlecht = document.createElement("p");
geschlecht.textContent = "Geschlecht: " + (hund.geschlecht || "Keine Angabe");

const beschreibung = document.createElement("p");
beschreibung.textContent = hund.beschreibung || "";


    inhalt.append(name, status, alter, geschlecht, beschreibung);
    karte.append(inhalt);
    liste.append(karte);
  });
}
function zeigeHund(hund) {
  const details = document.getElementById("hundedetails");
  const liste = document.getElementById("hundeliste");

  liste.style.display = "none";
  document.getElementById("hundefilter").style.display = "none";
  details.hidden = false;

  details.innerHTML = "";

  const zurueck = document.createElement("button");
  zurueck.textContent = "🐾 Zurück zu allen Hunden";
  zurueck.style.backgroundColor = "#BDE0FE";
zurueck.style.color = "#17324D";
zurueck.style.border = "none";
zurueck.style.borderRadius = "12px";
zurueck.style.padding = "12px 20px";
zurueck.style.fontSize = "16px";
zurueck.style.cursor = "pointer";

  zurueck.onclick = () => {
    details.hidden = true;
    liste.style.display = "";
    document.getElementById("hundefilter").style.display = "";
  };
  details.append(zurueck);
if (hund.fotos && hund.fotos.length > 0) {
  const bild = document.createElement("img");
  bild.src = hund.fotos[0];
  bild.alt = "Foto von " + hund.name;
  bild.style.width = "100%";
  bild.style.maxWidth = "450px";
  bild.style.height = "auto";
  bild.style.display = "block";
  bild.style.margin = "20px 0";

  details.append(bild);
}
  const titel = document.createElement("h2");
  titel.textContent = hund.name;

  const beschreibung = document.createElement("p");
  beschreibung.textContent = hund.beschreibung || "";

  details.append(titel, beschreibung);
  const anfrage = document.createElement("button");
anfrage.textContent = "❤️ Anfrage für " + hund.name + " senden";
anfrage.style.backgroundColor = "#BDE0FE";
anfrage.style.color = "#17324D";
anfrage.style.border = "none";
anfrage.style.borderRadius = "12px";
anfrage.style.padding = "14px 22px";
anfrage.style.fontSize = "16px";
anfrage.style.cursor = "pointer";
anfrage.style.marginTop = "20px";
  anfrage.onclick = () => {
  window.open("https://strassenhunde-rumaenien-in-not.de/selbstauskunft/", "_blank");
}

details.append(anfrage);
}
ladeHunde();
    document.getElementById("login-button").onclick = async () => {
  const email = document.getElementById("login-email").value.trim();
  const passwort = document.getElementById("login-passwort").value;
  const meldung = document.getElementById("login-meldung");

  meldung.textContent = "Anmeldung wird geprüft...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: passwort
  });

  if (error) {
    meldung.textContent = "Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.";
  } else {
    meldung.textContent = "Erfolgreich angemeldet!";
  }
};
  </script>
</body>
</html>
