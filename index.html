  <script>
    function filtern() {
      const suche = document.getElementById("suche").value.toLowerCase();
      const status = document.getElementById("status").value;
      document.querySelectorAll(".hund").forEach(hund => {
        const passt = hund.dataset.name.includes(suche) &&
          (!status || hund.dataset.status === status);
        hund.style.display = passt ? "" : "none";
      });
    }

    async function ladeHunde() {
  const { data, error } = await supabaseClient
    .from("hunde")
    .select("*");

  if (error) {
    console.error("Fehler beim Laden:", error);
    return;
  }

  const liste = document.getElementById("hundeliste");
  liste.innerHTML = "";

  data.forEach(hund => {
    const karte = document.createElement("div");
    karte.className = "hund";
    karte.style.cursor = "pointer";
karte.addEventListener("click", () => zeigeHund(hund));
    karte.dataset.name = hund.name || "";
    karte.dataset.status = hund.vermittlungsstatus || "";
if (hund.fotos && hund.fotos.length > 0) {
  const bild = document.createElement("img");
  bild.src = hund.fotos[0];
  bild.alt = "Foto von " + hund.name;
  karte.append(bild);
}
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";

    const name = document.createElement("h2");
    name.textContent = hund.name || "Unbekannt";

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = hund.vermittlungsstatus || "";

    const alter = document.createElement("p");
alter.textContent = "Alter: " + (hund.alter ?? "Keine Angabe");

const geschlecht = document.createElement("p");
geschlecht.textContent = "Geschlecht: " + (hund.geschlecht || "Keine Angabe");

const beschreibung = document.createElement("p");
beschreibung.textContent = hund.beschreibung || "";


    inhalt.append(name, status, alter, geschlecht, beschreibung);
    karte.append(inhalt);
    liste.append(karte);
  });

}
function zeigeHund(hund) {
  const details = document.getElementById("hundedetails");
  const liste = document.getElementById("hundeliste");

  liste.style.display = "none";
  document.getElementById("hundefilter").style.display = "none";
  details.hidden = false;

  details.innerHTML = "";

  const zurueck = document.createElement("button");
  zurueck.textContent = "🐾 Zurück zu allen Hunden";
  zurueck.style.backgroundColor = "#BDE0FE";
zurueck.style.color = "#17324D";
zurueck.style.border = "none";
zurueck.style.borderRadius = "12px";
zurueck.style.padding = "12px 20px";
zurueck.style.fontSize = "16px";
zurueck.style.cursor = "pointer";

  zurueck.onclick = () => {
    details.hidden = true;
    liste.style.display = "";
    document.getElementById("hundefilter").style.display = "";
  };
  details.append(zurueck);
if (hund.fotos && hund.fotos.length > 0) {
  const galerie = document.createElement("div");
  galerie.style.display = "flex";
  galerie.style.justifyContent = "flex-start";
galerie.style.width = "fit-content";
galerie.style.maxWidth = "100%";
  galerie.style.flexWrap = "wrap";
  galerie.style.gap = "8px";
  galerie.style.margin = "20px 0";
  galerie.style.alignItems = "center";

  let aktuellesBild = 0;
  const bildbereich = document.createElement("div");
bildbereich.style.width = "700px";
bildbereich.style.maxWidth = "100%";
bildbereich.style.height = "500px";
bildbereich.style.display = "flex";
bildbereich.style.alignItems = "center";
bildbereich.style.justifyContent = "center";
bildbereich.style.flexShrink = "1";
bildbereich.style.minWidth = "0";
  const hauptbild = document.createElement("img");
  hauptbild.src = hund.fotos[0];
  function wechsleBild(richtung) {
  aktuellesBild = (aktuellesBild + richtung + hund.fotos.length) % hund.fotos.length;
  hauptbild.src = hund.fotos[aktuellesBild];
}
  hauptbild.alt = "Foto von " + hund.name;
  hauptbild.style.width = "100%";
  hauptbild.style.maxHeight = "500px";
  hauptbild.style.maxWidth = "700px";
  hauptbild.style.height = "100%";
  hauptbild.style.objectFit = "contain";
hauptbild.style.objectPosition = "left center";
  hauptbild.style.borderRadius = "12px";
  hauptbild.style.backgroundColor = "#f1f5f9";

  const pfeilLinks = document.createElement("button");
pfeilLinks.textContent = "❮";
pfeilLinks.style.backgroundColor = "#BDE0FE";
pfeilLinks.style.color = "#17324D";
pfeilLinks.style.border = "none";
pfeilLinks.style.borderRadius = "50%";
pfeilLinks.style.width = "44px";
pfeilLinks.style.height = "44px";
pfeilLinks.style.fontSize = "24px";
pfeilLinks.style.cursor = "pointer";
pfeilLinks.onclick = () => wechsleBild(-1);
  const pfeilRechts = document.createElement("button");
pfeilRechts.textContent = "❯";
pfeilRechts.style.backgroundColor = "#BDE0FE";
pfeilRechts.style.color = "#17324D";
pfeilRechts.style.border = "none";
pfeilRechts.style.borderRadius = "50%";
pfeilRechts.style.width = "44px";
pfeilRechts.style.height = "44px";
pfeilRechts.style.fontSize = "24px";
pfeilRechts.style.cursor = "pointer";
pfeilRechts.onclick = () => wechsleBild(1);
  const vorschauen = document.createElement("div");
  vorschauen.style.display = "flex";
  vorschauen.style.flexDirection = "column";
  vorschauen.style.gap = "10px";
  vorschauen.style.maxHeight = "500px";
  vorschauen.style.overflowY = "auto";

  hund.fotos.forEach((foto, index) => {
    const mini = document.createElement("img");
    mini.src = foto;
    mini.alt = "Foto " + (index + 1);
    mini.style.width = "110px";
    mini.style.height = "95px";
    mini.style.objectFit = "cover";
    mini.style.borderRadius = "8px";
    mini.style.cursor = "pointer";
    mini.style.border = index === 0
      ? "3px solid #8DE0FE"
      : "3px solid transparent";

    mini.onclick = () => {
      hauptbild.src = foto;

      vorschauen.querySelectorAll("img").forEach(bild => {
        bild.style.border = "3px solid transparent";
      });

      mini.style.border = "3px solid #8DE0FE";
    };

    vorschauen.append(mini);
  });

bildbereich.append(hauptbild);
galerie.append(pfeilLinks, bildbereich, pfeilRechts, vorschauen);
  details.append(galerie);
}
  const titel = document.createElement("h2");
  titel.textContent = hund.name;

  const beschreibung = document.createElement("p");
  beschreibung.textContent = hund.beschreibung || "";

 const datenblatt = document.createElement("div");

datenblatt.style.display = "grid";
datenblatt.style.gridTemplateColumns = "repeat(auto-fit, minmax(180px, 1fr))";
datenblatt.style.gap = "12px";
datenblatt.style.margin = "20px 0";

const angaben = [
  ["Geburtsdatum", hund.geburtsdatum],
  ["Geschlecht", hund.geschlecht],
  ["Aufenthaltsort", hund.aufenthaltsort],
  ["Größe", hund.groesse ? hund.groesse + " cm" : ""],
  ["Gewicht", hund.gewicht ? hund.gewicht + " kg" : ""],
  ["Geimpft", hund.geimpft],
  ["Gechippt", hund.gechippt],
  ["Kastriert", hund.kastriert],
  ["Status", hund.status]
];

angaben.forEach(([bezeichnung, wert]) => {
  const feld = document.createElement("div");
  feld.style.backgroundColor = "#f1f5f9";
  feld.style.padding = "12px";
  feld.style.borderRadius = "10px";

  const label = document.createElement("strong");
  label.textContent = bezeichnung;

  const inhalt = document.createElement("div");
  inhalt.textContent = wert === null || wert === undefined || wert === ""
    ? "Nicht angegeben"
    : String(wert);

  feld.append(label, inhalt);
  datenblatt.append(feld);
});

details.append(titel, datenblatt, beschreibung);
  const anfrage = document.createElement("button");
anfrage.textContent = "❤️ Anfrage für " + hund.name + " senden";
anfrage.style.backgroundColor = "#BDE0FE";
anfrage.style.color = "#17324D";
anfrage.style.border = "none";
anfrage.style.borderRadius = "12px";
anfrage.style.padding = "14px 22px";
anfrage.style.fontSize = "16px";
anfrage.style.cursor = "pointer";
anfrage.style.marginTop = "20px";
  anfrage.onclick = () => {
  window.open("https://strassenhunde-rumaenien-in-not.de/selbstauskunft/", "_blank");
}

details.append(anfrage);
  supabaseClient.auth.getUser().then(({ data }) => {
  if (!data.user) return;

  const loeschen = document.createElement("button");
  loeschen.textContent = "🗑️ Hund löschen";
  loeschen.type = "button";
  loeschen.style.backgroundColor = "#ffdddd";
  loeschen.style.border = "none";
  loeschen.style.borderRadius = "12px";
  loeschen.style.padding = "12px 20px";
  loeschen.style.margin = "15px";
  loeschen.style.cursor = "pointer";
    loeschen.onclick = async () => {
  if (!confirm("Möchtest du " + hund.name + " wirklich löschen?")) return;

  const { data: { user }, error: authFehler } =
    await supabaseClient.auth.getUser();

  if (authFehler || !user) {
    alert("Bitte als Mitarbeiter anmelden.");
    return;
  }

  const { data: geloescht, error } = await supabaseClient
    .from("hunde")
    .delete()
    .eq("id", hund.id)
    .select("id");

  if (error) {
    alert("Fehler beim Löschen: " + error.message);
    return;
  }

  if (!geloescht || geloescht.length === 0) {
    alert("Löschen nicht erlaubt.");
    return;
  }

  details.hidden = true;
  document.getElementById("hundefilter").style.display = "";
  document.getElementById("hundeliste").style.display = "";
  await ladeHunde();
};

  details.append(loeschen);
});
}
ladeHunde();
    document.getElementById("login-button").onclick = async () => {
  const email = document.getElementById("login-email").value.trim();
  const passwort = document.getElementById("login-passwort").value;
  const meldung = document.getElementById("login-meldung");

  meldung.textContent = "Anmeldung wird geprüft...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: passwort
  });

  if (error) {
    meldung.textContent = "Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.";
  } else {
    const { data: mitarbeiter, error: rollenFehler } = await supabaseClient
  .from("mitarbeiter")
  .select("rolle")
  .eq("user_id", data.user.id)
  .maybeSingle();

if (rollenFehler || !mitarbeiter ||
    !["admin", "mitarbeiter"].includes(mitarbeiter.rolle)) {
  meldung.textContent = "Kein Zugang zur Hunde-Verwaltung.";
  await supabaseClient.auth.signOut();
} else {
  meldung.textContent = "Angemeldet als " + mitarbeiter.rolle;
  document.getElementById("verwaltung").hidden = false;
}
  }
};
document.getElementById("hund-hinzufuegen").onclick = () => {
  const formular = document.getElementById("hunde-formular");
  formular.hidden = false;
};
    async function anmeldungWiederherstellen() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) return;

  const { data: mitarbeiter, error } = await supabaseClient
    .from("mitarbeiter")
    .select("rolle")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !mitarbeiter ||
      !["admin", "mitarbeiter"].includes(mitarbeiter.rolle)) {
    return;
  }

  document.getElementById("verwaltung").hidden = false;
  document.getElementById("login-meldung").textContent =
    "Angemeldet als " + mitarbeiter.rolle;
}
document.getElementById("hund-speichern").onclick = async () => {
  const meldung = document.getElementById("speicher-meldung");
  meldung.textContent = "Hund wird gespeichert...";
  const wert = (id) => document.getElementById(id).value;

  const hund = {
    name: wert("hund-name"),
    geburtsdatum: wert("hund-geburtsdatum") || null,
    geschlecht: wert("hund-geschlecht"),
    aufenthaltsort: wert("hund-aufenthaltsort"),
    groesse: wert("hund-groesse") ? Number(wert("hund-groesse")) : null,
    gewicht: wert("hund-gewicht") ? Number(wert("hund-gewicht")) : null,
    geimpft: wert("hund-geimpft"),
    gechipt: wert("hund-gechipt"),
    kastriert: wert("hund-kastriert"),
    status: wert("hund-status"),
    beschreibung: wert("hund-beschreibung")
  };
  
  const dateien = document.getElementById("hund-fotos").files;
const fotoUrls = [];

for (const datei of dateien) {
  const dateiname = crypto.randomUUID() + "-" + datei.name;

  const { error: uploadFehler } = await supabaseClient.storage
    .from("hundefotos")
    .upload(dateiname, datei, {
      contentType: datei.type
    });

  if (uploadFehler) {
    meldung.textContent = "Foto-Upload fehlgeschlagen: " + uploadFehler.message;
    return;
  }

  const { data } = supabaseClient.storage
    .from("hundefotos")
    .getPublicUrl(dateiname);

  fotoUrls.push(data.publicUrl);
}

hund.fotos = fotoUrls;
  const { error } = await supabaseClient
  .from("hunde")
  .insert([hund]);

if (error) {
  meldung.textContent = "Fehler: " + error.message;
  return;
}

meldung.textContent = "🐾 Hund erfolgreich gespeichert!";
await ladeHunde();
  };
anmeldungWiederherstellen();
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    document.getElementById("passwort-zuruecksetzen").hidden = false;
    document.getElementById("mitarbeiter-login").hidden = true;
  }
});

document.getElementById("passwort-speichern").onclick = async () => {
  const passwort = document.getElementById("neues-passwort").value;
  const meldung = document.getElementById("passwort-meldung");

  if (passwort.length < 8) {
    meldung.textContent = "Bitte mindestens 8 Zeichen eingeben.";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password: passwort
  });

  if (error) {
    meldung.textContent = "Fehler: " + error.message;
  } else {
    meldung.textContent = "Passwort erfolgreich gespeichert!";
    document.getElementById("passwort-zuruecksetzen").hidden = true;
    await supabaseClient.auth.signOut();
  }
};
  </script>
